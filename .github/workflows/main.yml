
name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable EXE
        run: npm run build:portable

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: DLSS5-Swapper-portable
          path: dist/*.exe
          if-no-files-found: error
